name: Validate skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Install exact supported runtime candidate
        run: npm install --prefix "$RUNNER_TEMP/js-superagent-candidate" --ignore-scripts --no-audit --no-fund --package-lock=false js-superagent@0.15.0-alpha.18
      - name: Verify published runtime compatibility
        env:
          JS_SUPERAGENT_CANDIDATE_PACKAGE: ${{ runner.temp }}/js-superagent-candidate/node_modules/js-superagent
        run: npm test
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:version
